# Verificación del backend en cada push a main y en cada pull request (SPEC-B22 DP-09).
# Railway, con "Wait for CI", sólo despliega un commit de main si esto pasa.
name: backend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      # Las pruebas de IDs y Obs levantan un PostgreSQL 18 temporal (tests/test_ids.py).
      - name: PostgreSQL 18
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-18
      - run: pip install -r requirements.lock
      - run: python -m ruff check app tests
      - run: python -m ruff format --check app tests
      - run: python -m pytest -q
